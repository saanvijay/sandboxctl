# Dev overrides for minikube/kind. Prod primitives stay identical — only
# resource shapes, endpoints, and the microVM tier differ (DESIGN.md §14.13).
service:
  env: dev

image:
  # Must match the tag the README builds and `minikube image load` stores
  # the image under. Prod overrides to a registry path in values-prod.yaml.
  repository: sandbox-ctl
  tag: dev
  pullPolicy: Never  # use `minikube image load sandbox-ctl:dev`

runtime:
  driver: container
  classMvm: ""         # Kata needs /dev/kvm; disabled in dev.
  apiUrl: http://runtime.dev.svc:8080
  agentGrpcEndpoint: grpc://agent.dev.svc:50051

snapshot:
  storeUrl: http://minio.dev.svc:9000
  # Dev placeholders — the chart's snapshot-secret.yaml creates the
  # Secret when both are set. Not credentials; the dev backend never
  # reaches the snapshot store.
  keyId: dev-key
  secret: dev-secret

creds:
  signingKeyPath: /etc/sandbox-ctl/signing.key

logging:
  level: DEBUG
  format: text

kubernetes:
  nodeSelector: ""
  # Any non-empty string; the chart requires one and dev pulls nothing.
  imagePullSecret: dev-noop
