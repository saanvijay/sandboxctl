{{- /*
Creates the `sandbox-ctl-snapshot` Secret the Deployment references, but
only when values carry both the key id and the secret. In prod the
operator usually ships an externally-managed Secret of the same name
(External Secrets, KMS projection, etc.) and leaves these values empty so
this template skips creation.
*/ -}}
{{- if and .Values.snapshot.keyId .Values.snapshot.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-ctl-snapshot
  namespace: {{ .Values.kubernetes.namespace | quote }}
type: Opaque
stringData:
  key-id: {{ .Values.snapshot.keyId | quote }}
  secret: {{ .Values.snapshot.secret | quote }}
{{- end }}
