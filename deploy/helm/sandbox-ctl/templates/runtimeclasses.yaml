{{- if .Values.runtime.classCtr }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtime.classCtr }}
handler: runc
{{- end }}
{{- if .Values.runtime.classMvm }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtime.classMvm }}
handler: kata
{{- end }}
