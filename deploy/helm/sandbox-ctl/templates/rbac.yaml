apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-api
  namespace: {{ .Values.kubernetes.namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-api
  namespace: {{ .Values.kubernetes.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-api
subjects:
  - kind: ServiceAccount
    name: sandbox-api
    namespace: {{ .Values.kubernetes.namespace | quote }}
