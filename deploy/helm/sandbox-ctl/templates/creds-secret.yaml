{{- /*
Signing key for short-lived per-session credentials.

- Dev: the chart generates a 64-byte key on first install and reuses the
  existing one across upgrades via `lookup`, so already-minted credentials
  stay valid until they expire naturally.
- Prod: ship a KMS-projected Secret of the same name (or override this
  template) — do NOT rely on chart-generated keys there.

The Deployment mounts this Secret at the path config.py reads from
CREDS_SIGNING_KEY_PATH (default: /etc/sandbox-ctl/signing.key).
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Values.kubernetes.namespace "sandbox-ctl-creds") -}}
{{- $keyB64 := "" -}}
{{- if $existing -}}
{{-   $keyB64 = index $existing.data "signing.key" -}}
{{- else -}}
{{-   $keyB64 = randAlphaNum 64 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-ctl-creds
  namespace: {{ .Values.kubernetes.namespace | quote }}
type: Opaque
data:
  signing.key: {{ $keyB64 }}
